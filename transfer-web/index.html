<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme.js"></script>
    <!--
      TODO(smart app banner): once the App Store ID exists, add
      <meta name="apple-itunes-app" content="app-id=<ID>, app-argument=<full URL>">.
      app-argument must include the #fragment, which a static tag can't know,
      so set it at runtime from main.tsx (create the meta element with
      location.href before first paint) rather than hardcoding it here.
    -->
    <title>Your Thought Reps export</title>
    <!--
      Link preview. No og:url: every link is one-time, and its key is in the
      #fragment, which unfurlers never see. The image is rendered and
      published by site-landing's prerender (EXPORT_LINK_OG_IMAGE).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thought Reps" />
    <meta property="og:title" content="Your Thought Reps export" />
    <meta
      property="og:description"
      content="A one-time link to thoughts exported from Thought Reps. Open it on your iPhone to import them. It works once."
    />
    <meta property="og:image" content="https://thoughtreps.com/og/export-link.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Your Thought Reps export" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
