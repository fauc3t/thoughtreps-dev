# XcodeGen spec — the source of truth for ThoughtReps.xcodeproj.
# Regenerate the project after pulling or adding files:  xcodegen
name: ThoughtReps

options:
  bundleIdPrefix: com.thoughtreps
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1

targets:
  ThoughtReps:
    type: application
    platform: iOS
    sources:
      - path: ThoughtReps
      - path: Shared
    dependencies:
      - package: MarkdownUI
      - target: ThoughtRepsShare
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TRAppGroupIdentifier: group.$(TR_BUNDLE_ID)
    entitlements:
      path: Config/ThoughtReps.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(TR_BUNDLE_ID)
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TR_BUNDLE_ID)
        PRODUCT_NAME: ThoughtReps
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thought Reps
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos to add to your thoughts.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ThoughtRepsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ThoughtRepsShare
      - path: Shared
    info:
      path: ThoughtRepsShare/Info.plist
      properties:
        CFBundleDisplayName: Thought Reps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TRAppGroupIdentifier: group.$(TR_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $i, SUBQUERY($i.attachments, $a, (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" || ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "net.daringfireball.markdown") || (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" && NOT (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url"))).@count >= 1).@count >= 1 AND
              SUBQUERY(extensionItems, $i, SUBQUERY($i.attachments, $a, (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url")).@count > 1).@count == 0 AND
              SUBQUERY(extensionItems, $i, SUBQUERY($i.attachments, $a, (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" && NOT (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url"))).@count > 1).@count == 0 AND
              SUBQUERY(extensionItems, $i, SUBQUERY($i.attachments, $a, (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url") && NOT (ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" || ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "net.daringfireball.markdown")).@count > 0).@count == 0
    entitlements:
      path: ThoughtRepsShare/ThoughtRepsShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(TR_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TR_BUNDLE_ID).share
        PRODUCT_NAME: ThoughtRepsShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  ThoughtRepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThoughtRepsTests
    dependencies:
      - target: ThoughtReps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TR_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ThoughtReps.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ThoughtReps"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ThoughtReps:
    build:
      targets:
        ThoughtReps: all
        ThoughtRepsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThoughtRepsTests
    archive:
      config: Release
