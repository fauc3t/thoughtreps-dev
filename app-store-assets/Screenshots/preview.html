<!doctype html>
<meta charset="utf-8" />
<title>App Store screenshots: preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { margin: 0; padding: 24px 32px 64px; font: 15px/1.5 ui-monospace, Menlo, monospace; color: #111214; background: #e9e9e6; }
  h1 { font: 800 22px/1.2 system-ui, sans-serif; margin: 0 0 4px; }
  h2 { font: 700 16px/1.2 system-ui, sans-serif; margin: 40px 0 12px; }
  p { margin: 0 0 12px; color: #5e6066; }
  .row { display: flex; gap: 24px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
  figure { margin: 0; flex: none; }
  figcaption { margin-top: 6px; font-size: 13px; color: #5e6066; }
  img { display: block; border: 2px solid #111214; background: #fff; }
  .big img { width: 330px; height: auto; }
  /* About what the store shows in search results: the first three screenshots at roughly 150 px wide each. */
  .card { background: #fff; border-radius: 16px; padding: 12px; box-sizing: border-box; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); font: 14px/1.3 system-ui, sans-serif; width: max-content; }
  .card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card .top img { width: 44px; height: 44px; border-radius: 10px; border: 0; }
  .card .top b { display: block; font-size: 15px; }
  .card .top span { color: #6e6e73; font-size: 12px; }
  .card .top .txt { flex: 1; min-width: 180px; }
  .card .get { background: #eee; color: #0a64d6; font-weight: 700; padding: 5px 16px; border-radius: 14px; }
  .card .shots { display: flex; gap: 8px; }
  .card .shots img { width: 150px; height: auto; border: 1px solid #ddd; border-radius: 10px; }
</style>
<h1>App Store screenshots: preview</h1>
<p>Every file in static/ (1320x2868). The search card shows the first three at about the size they appear in search results.</p>
<div id="out"></div>
<script src="src/copy.js"></script>
<script>
  const NAMES = SHOTS.map((s) => s.name);
  const src = (n) => `static/${n}-1320x2868.png`;
  document.getElementById('out').innerHTML =
    '<h2>All ' + NAMES.length + '</h2><div class="row big">' + NAMES.map((n) => `<figure><img src="${src(n)}" alt="" /><figcaption>${n}</figcaption></figure>`).join('') + '</div>' +
    '<h2>In search results (first three)</h2><figure><div class="card"><div class="top"><img src="../../design-assets/app-icon/light.svg" alt="" /><div class="txt"><b>Thought Reps</b><span>Write it down. It comes back.</span></div><div class="get">Get</div></div><div class="shots">' +
    NAMES.slice(0, 3).map((n) => `<img src="${src(n)}" alt="" />`).join('') + '</div></div><figcaption>~150 px per screenshot</figcaption></figure>';
</script>
