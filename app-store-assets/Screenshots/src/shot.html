<!doctype html>
<meta charset="utf-8" />
<title>App Store screenshot</title>
<link rel="stylesheet" href="../../Header/src/shared.css" />
<style>
  /* One 1320x2868 canvas in the Pop theme (AppTheme.popPalette, light; Futura titles, Avenir Next text, both shipped
     with macOS). No phone: each capture is a crop in a card with a thick ink border and a hard offset shadow, like
     Pop's own cards. Cards are laid out by src/copy.js. */
  :root { --pop-title: Futura, 'Futura PT', 'Trebuchet MS', sans-serif; --pop-text: 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif;
    --paper: #fff6e3; --soft: #ffe7b0; --ink: #141210; --muted: #5a5246; --accent: #f2542d; --margin: 90px; }
  html, body { background: var(--soft); }
  #stage { left: 0; top: 0; width: 1320px; height: 2868px; transform: none !important; overflow: hidden; }
  .copy { position: absolute; left: var(--margin); right: var(--margin); top: 120px; z-index: 1; }
  h1 { margin: 0; font: 700 var(--fs, 136px) / 1.0 var(--pop-title); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
  h1 mark { background: linear-gradient(transparent 58%, var(--accent) 58% 90%, transparent 90%); color: inherit; padding: 0 0.04em; }
  h1 .loop { display: inline-block; width: 0.5em; height: 0.5em; margin-left: 0.04em; vertical-align: 0.05em; color: var(--ink); }
  p.support { margin: 44px 0 0; font: 500 54px / 1.3 var(--pop-text); color: var(--muted); max-width: 1120px; }
  /* --s scales raw px to canvas px; --top/--bottom pick the raw rows shown; --pad and --padTop add blank raw px below and above. */
  .card { position: absolute; box-sizing: content-box; overflow: hidden; background: var(--bg, #ffffff);
    border: 10px solid var(--ink); border-radius: 64px; box-shadow: 34px 34px 0 var(--ink);
    width: calc(1320px * var(--s)); height: calc((var(--bottom) - var(--top) + var(--pad) + var(--padTop)) * 1px * var(--s));
    transform: rotate(var(--rot)); transform-origin: 50% 50%; }
  .card .clip { position: absolute; left: 0; top: calc(var(--padTop) * 1px * var(--s)); right: 0; height: calc((var(--bottom) - var(--top)) * 1px * var(--s)); overflow: hidden; }
  .card img { position: absolute; left: 0; top: calc(var(--top) * -1px * var(--s)); width: calc(1320px * var(--s)); display: block; }
</style>
<div id="stage">
  <div class="copy"><h1 id="head"></h1><p class="support" id="support"></p></div>
  <div id="cards"></div>
</div>
<script src="../../Header/src/shared.js"></script>
<script src="copy.js"></script>
<script>
  const html = (s) => s.replace('<loop></loop>', '<svg class="loop"><use href="#loop" /></svg>');
  // One font size for every headline: the largest at which the widest line of any of them fits.
  const fitSize = () => {
    const head = document.getElementById('head');
    let fs = 150;
    for (const shot of SHOTS) {
      head.innerHTML = html(shot.headline);
      for (head.style.setProperty('--fs', fs + 'px'); head.scrollWidth > 1320 - 180; ) {
        head.style.setProperty('--fs', --fs + 'px');
      }
    }
    return fs;
  };
  window.render = async (name) => {
    await Promise.all(['700 100px Futura', "500 50px 'Avenir Next'"].map((f) => document.fonts.load(f)));
    const shot = SHOTS.find((s) => s.name === name);
    const head = document.getElementById('head');
    head.style.setProperty('--fs', fitSize() + 'px');
    head.innerHTML = html(shot.headline);
    document.getElementById('support').textContent = shot.support;
    const cards = document.getElementById('cards');
    cards.innerHTML = '';
    const decoded = shot.cards.map((c) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = `left: ${c.x}px; top: ${c.y}px; --s: ${c.s}; --top: ${c.top}; --bottom: ${c.bottom}; --pad: ${c.pad ?? 0}; --padTop: ${c.padTop ?? 0};`
        + ` --rot: ${c.rot ?? 0}deg; --bg: ${c.bg ?? '#ffffff'}` + (c.shadow === false ? '; box-shadow: none' : '');
      const clip = Object.assign(document.createElement('div'), { className: 'clip' });
      const img = Object.assign(document.createElement('img'), { alt: '', src: `../raw/${c.raw}.png` });
      clip.append(img);
      card.append(clip);
      cards.append(card);
      return img.decode();
    });
    await Promise.all(decoded);
  };
</script>
