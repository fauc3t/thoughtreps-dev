<!doctype html>
<meta charset="utf-8" />
<title>App Store screenshot</title>
<link rel="stylesheet" href="../../Header/src/shared.css" />
<link rel="stylesheet" href="../../SearchResults/src/frame.css" />
<style>
  /* One 1320x2868 canvas. The phone is the raw 1320x2868 simulator capture scaled to --sw px wide inside an ink frame. */
  :root { --sw: 960px; --bw: 22px; --margin: 90px; }
  #stage { left: 0; top: 0; width: 1320px; height: 2868px; transform: none !important; }
  .copy { position: absolute; left: var(--margin); right: var(--margin); top: 110px; }
  h1 { font-size: var(--fs, 130px); text-align: left; }
  h1 mark { background: linear-gradient(transparent 60%, var(--hl) 60% 92%, transparent 92%); color: inherit; padding: 0 0.04em; }
  p.support { margin: 40px 0 0; font: 400 50px / 1.3 var(--mono); color: var(--muted); max-width: 1100px; }
  .phone { position: absolute; left: 50%; top: 570px; margin-left: calc((var(--sw) + var(--bw) * 2) / -2); width: var(--sw); height: calc(var(--sw) * 2868 / 1320); border: var(--bw) solid var(--ink); border-radius: calc(var(--sw) * 0.125 + var(--bw)); box-shadow: 24px 24px 0 var(--ink); background: var(--paper); overflow: hidden; }
  .phone img { display: block; width: 100%; height: 100%; }
  .island { position: absolute; left: 50%; top: 22px; width: 272px; height: 80px; margin-left: -136px; border-radius: 40px; background: var(--ink); }
</style>
<div id="stage">
  <div class="copy"><h1 id="head"></h1><p class="support" id="support"></p></div>
  <div class="phone"><img id="img" alt="" /><div class="island"></div></div>
</div>
<script src="../../Header/src/shared.js"></script>
<script src="copy.js"></script>
<script>
  const html = (s) => s.replace('<loop></loop>', '<svg class="loop"><use href="#loop" /></svg>');
  // One font size for every headline: the largest at which the widest line of any of them fits.
  const fitSize = () => {
    const head = document.getElementById('head');
    let fs = 170;
    for (const shot of SHOTS) {
      head.innerHTML = html(shot.headline);
      for (head.style.setProperty('--fs', fs + 'px'); head.scrollWidth > 1320 - 180; ) {
        head.style.setProperty('--fs', --fs + 'px');
      }
    }
    return fs;
  };
  window.render = async (name) => {
    await Promise.all([document.fonts.load("900 100px 'Archivo Variable'"), document.fonts.load("400 50px 'Paper Mono'")]);
    const shot = SHOTS.find((s) => s.name === name);
    const head = document.getElementById('head');
    head.style.setProperty('--fs', fitSize() + 'px');
    head.innerHTML = html(shot.headline);
    document.getElementById('support').textContent = shot.support;
    const img = document.getElementById('img');
    img.src = `../raw/${name}.png`;
    await img.decode();
  };
</script>
