<!doctype html>
<meta charset="utf-8" />
<title>Search Results C: in the app</title>
<link rel="stylesheet" href="../../Header/src/shared.css" />
<link rel="stylesheet" href="frame.css" />
<style>
  /* Everything inside .phone is in iPhone points; the whole phone is scaled up with one transform. */
  .group { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .phone-box { position: relative; flex: none; }
  .phone { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 390px; height: 844px; border: 12px solid var(--ink); border-radius: 62px; box-shadow: 10px 10px 0 var(--ink); background: var(--paper); overflow: hidden; box-sizing: content-box; }
  .island { position: absolute; left: 50%; top: 10px; width: 112px; height: 32px; margin-left: -56px; border-radius: 16px; background: var(--ink); z-index: 9; }
  .home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
  .tools { position: absolute; right: 18px; top: 58px; display: flex; gap: 20px; }
  .tools svg, .fab svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tools svg { width: 24px; height: 24px; color: var(--ink); }
  .nav-title { position: absolute; left: 16px; top: 96px; font: 800 32px / 1.1 var(--display); font-variation-settings: 'wdth' 100; letter-spacing: -0.005em; }
  .sec { position: absolute; left: 20px; font: 400 12px / 1 var(--mono); color: var(--muted); }
  .card { position: absolute; left: 16px; right: 16px; height: 134px; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--hl); border-radius: 12px; background: var(--paper); display: flex; flex-direction: column; gap: 5px; }
  .card .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .t { font: 600 17px / 1.25 var(--display); }
  .card .prev { font: 400 13px / 1.35 var(--mono); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .tag { margin-top: auto; align-self: flex-start; display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px; background: var(--soft); font: 400 11px / 1.2 var(--mono); }
  .card .tag i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  .lbls { position: relative; flex: none; width: 74px; height: 18px; }
  .lbls span { position: absolute; right: 0; top: 0; white-space: nowrap; padding: 2px 7px; border-radius: 6px; font: 600 11px / 14px var(--mono); }
  .lbls .today { background: var(--hl); color: var(--ink); }
  .lbls .late { background: var(--ink); color: var(--paper); }
  .rise { position: absolute; right: -9px; top: -9px; width: 32px; height: 32px; box-sizing: border-box; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--paper); display: grid; place-items: center; }
  .rise svg { width: 19px; height: 19px; }
  .fab { position: absolute; right: 20px; bottom: 36px; width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
  .fab svg { width: 24px; height: 24px; }
  h1 { text-align: left; }
</style>
<div id="stage">
  <div class="group">
    <h1 id="head"></h1>
    <div class="phone-box" id="box">
      <div class="phone" id="phone">
        <div class="island"></div>
        <div class="tools">
          <svg viewBox="0 0 24 24"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg>
          <svg viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg>
        </div>
        <div class="nav-title">Timeline</div>
        <div class="sec" style="top: 152px">Due</div>
        <div class="fab"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></svg></div>
        <div class="home"></div>
      </div>
    </div>
  </div>
</div>
<script src="../../Header/src/shared.js"></script>
<script src="frame.js"></script>
<script>
  const tall = FH > 2400;
  const fs = tall ? 250 : 260, p = (FH - 300) / 868;
  const head = document.getElementById('head');
  head.innerHTML = headlineHTML;
  head.style.fontSize = fs + 'px';
  head.style.marginRight = (tall ? 150 : 130) + 'px';
  const box = document.getElementById('box'), phone = document.getElementById('phone');
  box.style.width = 414 * p + 'px';
  box.style.height = 868 * p + 'px';
  phone.style.transform = `scale(${p})`;

  // All strings are from the landing site (Hero.tsx NOTES, HelpExamples.tsx). Labels follow DueLabel in ThoughtCard.swift:
  // "due today" is the hl badge, "due Nd ago" the ink one. The Due list sorts by nextDueAt, so the most overdue is on top.
  const ITEMS = [
    { title: 'One wild and precious life', prev: '“Tell me, what is it you plan to do with your one wild and precious life?”', tag: 'quotes' },
    { title: 'Read later: the case for slow email', prev: "Saved Tuesday, 12 min read. You said you'd get to it.", tag: 'toread' },
    { title: 'Read: how bees see color', prev: 'Saved from Safari.', tag: 'toread' },
    { title: 'Notes on reflection', prev: '…a short habit of reflection each evening…', tag: 'journal' },
    { title: 'Why journals work', prev: '…writing builds reflection into the day…', tag: 'journal' },
  ];
  const LABELS = ['due 3d ago', 'due 2d ago', 'due 1d ago', 'due today'];
  const TOP = 176, PITCH = 142, N = ITEMS.length, PERIOD = 12 / N;
  const ease = bezier(0.3, 0, 0.15, 1);
  const smooth = (x) => x * x * (3 - 2 * x);
  const cards = ITEMS.map((it) => {
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = `<div class="head"><span class="t">${it.title}</span><span class="lbls">${LABELS.map((l, j) => `<span class="${j === 3 ? 'today' : 'late'}">${l}</span>`).join('')}</span></div><div class="prev">${it.prev}</div><span class="tag"><i></i>#${it.tag}</span><div class="rise"><svg class="loop" viewBox="0 0 24 24"><use href="#loop" /></svg></div>`;
    phone.insertBefore(el, phone.querySelector('.fab'));
    return { el, labels: [...el.querySelectorAll('.lbls span')], rise: el.querySelector('.rise') };
  });

  // render(t): t in seconds. Each period the top (most overdue) thought leaves, the rest age a day and move up,
  // and a new "due today" thought enters at the bottom. Slot 4 is the off-list slot a thought waits in.
  window.render = (t) => {
    const k = Math.floor(t / PERIOD), u = (t % PERIOD) / PERIOD;
    const v = ease(clamp01((u - 0.12) / 0.55));
    cards.forEach((c, i) => {
      const slot = (((i - k) % N) + N) % N;
      const entering = slot === N - 1, leaving = slot === 0;
      const fresh = entering ? smooth(v) : slot === N - 2 ? 1 - smooth(v) : 0;
      const opacity = leaving ? 1 - smooth(clamp01(v / 0.5)) : entering ? smooth(clamp01((v - 0.3) / 0.5)) : 1;
      const s = c.el.style;
      s.top = TOP + PITCH * (slot - v * (leaving ? 0.6 : 1)) + 'px';
      s.opacity = opacity;
      s.visibility = opacity ? 'visible' : 'hidden';
      s.borderColor = `color-mix(in srgb, var(--ink) ${fresh * 100}%, var(--hl))`;
      const o = 4 * fresh;
      s.boxShadow = o ? `${o}px ${o}px 0 var(--ink)` : 'none';
      const from = Math.min(slot, 3), to = Math.max(slot - 1, 0), w = smooth(clamp01((v - 0.35) / 0.3));
      c.labels.forEach((l, j) => (l.style.opacity = from === to ? (j === from ? 1 : 0) : j === from ? 1 - w : j === to ? w : 0));
      c.rise.style.opacity = clamp01((fresh - 0.6) / 0.4);
      c.rise.style.transform = `scale(${0.4 + 0.6 * clamp01((fresh - 0.6) / 0.4)})`;
    });
  };
  render(2);
</script>
