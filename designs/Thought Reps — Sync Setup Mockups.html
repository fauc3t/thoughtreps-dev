<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thought Reps — Sync Setup Mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--bg:#f2f2f7;--sep:#c6c6c8;--sec:#8e8e93;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:#e4e4e9;color:#111;display:flex;height:100vh;overflow:hidden}
#side{width:260px;flex:none;background:#fff;border-right:1px solid #d0d0d5;overflow-y:auto;padding:14px 0 30px}
#side h1{font-size:15px;margin:0 16px 4px}
#side p.note{font-size:11px;color:#666;margin:0 16px 10px;line-height:1.4}
#side h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#888;margin:16px 16px 4px}
#side a{display:block;padding:5px 16px;font-size:13px;color:#222;cursor:pointer;text-decoration:none;border-left:3px solid transparent}
#side a:hover{background:#f3f3f6}
#side a.on{background:#e8f1ff;border-left-color:var(--blue);color:#0050b3;font-weight:600}
#side a b{display:inline-block;min-width:56px;color:#888;font-weight:600;font-size:11px}
#main{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 20px 40px}
#cap{margin-top:14px;max-width:440px;text-align:center;font-size:13px;color:#444;line-height:1.4}
#cap b{color:#000}
#nextprev{margin-top:8px;font-size:12px;color:#777}
/* phone */
.phone{width:393px;height:852px;flex:none;background:var(--bg);border-radius:48px;border:10px solid #111;box-shadow:0 12px 40px rgba(0,0,0,.25);position:relative;overflow:hidden;font-size:17px;letter-spacing:-.01em}
.phone *{-webkit-user-select:none;user-select:none}
.status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px 34px;font-weight:600;font-size:15px;flex:none}
.status i{font-style:normal;font-size:12px;letter-spacing:2px}
.screen{display:flex;flex-direction:column;height:100%;position:relative}
.nav{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;position:relative;background:var(--bg)}
.nav .t{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;pointer-events:none}
.nav .l,.nav .r{color:var(--blue);cursor:pointer;z-index:1;padding:6px 6px;font-size:17px}
.nav .l.chev:before{content:"";display:inline-block;width:10px;height:10px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(45deg);margin:0 6px 1px 4px}
.nav .r.dim{color:#b0b0b5}
.body{flex:1;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body.big{padding-top:0}
.large{font-size:34px;font-weight:700;letter-spacing:.2px;margin:2px 4px 10px}
.sec{margin:22px 0 0}
.sec>h3{font-size:13px;text-transform:uppercase;color:var(--sec);font-weight:400;margin:0 16px 6px;letter-spacing:0}
.sec>.f{font-size:13px;color:var(--sec);margin:6px 16px 0;line-height:1.35}
.sec>.f.red{color:var(--red)}
.grp{background:#fff;border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;min-height:44px;padding:0 16px;position:relative;gap:10px}
.row+.row:before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.ic+.row.ic:before{left:58px}
.row .lab{flex:1;line-height:1.2;padding:11px 0}
.row .sub{display:block;font-size:13px;color:var(--sec);margin-top:2px}
.row .val{color:var(--sec);white-space:nowrap}
.row .val.red{color:var(--red)}
.row.nav-r[data-go]:after,.row.chv:after{content:"";width:8px;height:8px;border-right:2px solid #c4c4c7;border-top:2px solid #c4c4c7;transform:rotate(45deg);margin-left:2px;flex:none}
.row[data-go],.btn[data-go],.sw[data-go],.cell[data-go]{cursor:pointer}
.row[data-go]:hover{background:#f6f6f8}
.row.blue .lab{color:var(--blue)}
.row.destr .lab{color:var(--red)}
.row.ctr .lab{text-align:center}
.row.off .lab{color:#b0b0b5}
.tile{width:30px;height:30px;border-radius:7px;flex:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.sw{width:51px;height:31px;border-radius:16px;background:#e5e5ea;position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--green)}.sw.on:after{left:22px}
.btn{display:block;border-radius:12px;text-align:center;padding:15px 12px;font-weight:600;font-size:17px;margin:12px 0 0}
.btn.p{background:var(--blue);color:#fff}
.btn.p.dis{background:#c9c9ce;color:#fff;cursor:not-allowed}
.btn.s{background:transparent;color:var(--blue);font-weight:400;padding:10px}
.btn.d{background:#fff;color:var(--red)}
.btn.g{background:#e8e8ed;color:var(--blue)}
.btn.sm{display:inline-block;padding:8px 18px;font-size:15px;margin:10px 0 0;border-radius:18px}
.apple{background:#000;color:#fff;border-radius:8px;padding:14px;text-align:center;font-weight:600;font-size:17px;margin-top:14px;cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center}
.apple svg{width:16px;height:18px;fill:#fff}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 6px 0}
.hero h2{font-size:26px;margin:14px 0 8px;letter-spacing:0}
.hero p{margin:0;color:#444;font-size:15px;line-height:1.4}
.facts{margin:16px 0 0}
.fact{display:flex;gap:10px;align-items:center;padding:7px 4px;font-size:16px}
.fact:before{content:"✓";color:var(--blue);font-weight:700;width:18px}
.small{font-size:12px;color:var(--sec);line-height:1.4;text-align:center;margin:16px 6px 0}
.small a{color:var(--blue);text-decoration:none}
.banner{background:#fff;border-radius:10px;padding:12px 14px;margin:12px 0 0;display:flex;gap:10px;align-items:center;font-size:14px;border:1px solid #ffd0cc}
.banner b{color:var(--red)}
.banner span.try{margin-left:auto;color:var(--blue);font-weight:600;cursor:pointer}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;top:54px;background:var(--bg);border-radius:12px 12px 0 0;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet.short{top:auto;max-height:70%}
.sheet.white{background:#fff}
.sheet .nav{background:inherit}
.grab{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#c4c4c7}
.alert{position:absolute;z-index:9;left:50%;top:50%;width:270px;margin:-90px 0 0 -135px;background:rgba(250,250,250,.97);border-radius:14px;text-align:center;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.alert .a-b{padding:18px 16px 16px;font-size:13px;line-height:1.35}
.alert .a-b b{display:block;font-size:17px;margin-bottom:4px}
.alert .a-b input{width:100%;margin-top:10px;padding:6px 8px;border:1px solid #c6c6c8;border-radius:6px;font:inherit;font-size:14px}
.alert .a-a{display:flex;border-top:.5px solid #b8b8bc}
.alert .a-a.v{flex-direction:column}
.alert .a-a div{flex:1;padding:12px;color:var(--blue);font-size:17px;cursor:pointer}
.alert .a-a:not(.v) div+div{border-left:.5px solid #b8b8bc;font-weight:600}
.alert .a-a.v div+div{border-top:.5px solid #b8b8bc}
.alert .a-a div.red{color:var(--red)}
.alert .a-a div.bold{font-weight:600}
/* tab bar */
.tabs{height:84px;flex:none;border-top:.5px solid var(--sep);background:rgba(249,249,249,.95);display:flex;padding-top:8px}
.tabs div{flex:1;text-align:center;font-size:10px;color:#999;position:relative}
.tabs div.on{color:var(--blue)}
.tabs div u{display:block;text-decoration:none;font-size:22px;margin-bottom:2px;height:26px}
.tabs div .dot{position:absolute;top:-2px;left:57%;width:9px;height:9px}
/* status head */
.sh{text-align:center;padding:10px 20px 4px}
.sh .sym{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.sh .l1{font-size:20px;font-weight:600;line-height:1.25}
.sh .l2{font-size:14px;color:var(--sec);margin-top:5px;line-height:1.35}
.bar{height:8px;background:#e5e5ea;border-radius:4px;margin:14px 6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar.warn i{background:var(--orange)}
.meter{padding:14px 16px}
.meter .lab{padding:0 0 8px}
.meter .bar{margin:0}
/* qr */
.qr{width:200px;height:200px;margin:18px auto 0;background:#fff;padding:10px;border-radius:10px;display:grid;grid-template-columns:repeat(25,1fr);gap:0}
.qr i{background:#111}.qr i.w{background:#fff}
/* recovery */
.code{background:#fff;border-radius:10px;padding:14px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;text-align:center}
.code span em{display:block;font-style:normal;font-size:9px;color:#aaa;margin-bottom:1px}
.entry{background:#fff;border-radius:10px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7;word-break:break-all;min-height:120px}
.entry.bad{outline:1.5px solid var(--red)}
.entry.ok{outline:1.5px solid var(--green)}
.entry .cur{border-right:2px solid var(--blue);margin-left:1px}
.entry .x{color:var(--red);background:#ffe5e3;border-radius:3px}
.cam{background:#1b1b1d;border-radius:14px;height:300px;margin-top:14px;position:relative;overflow:hidden}
.cam:after{content:"";position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border:3px solid #fff;border-radius:18px}
/* auth overlay */
.faceid{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.faceid div{width:240px;background:rgba(250,250,250,.97);border-radius:20px;padding:26px 16px;text-align:center;font-size:14px}
.faceid div b{display:block;font-size:34px;color:var(--blue);margin-bottom:8px;font-weight:400}
/* timeline */
.tl{background:#f4efe6;color:#1d1a16;font-family:"New York",Georgia,serif}
.tl .nav{background:#f4efe6}
.card{background:#fffdf8;border-radius:16px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 0 0 .5px rgba(60,40,10,.12)}
.card .m{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8a8070;margin-top:8px;display:flex;justify-content:space-between}
.card p{margin:0;font-size:16px;line-height:1.4}
.card.notice{background:#fbeede;position:relative;cursor:pointer}
.card.notice b{font-family:var(--font);font-size:15px}
.card.notice p{font-family:var(--font);font-size:14px;color:#5a4a36;margin-top:3px}
.card.notice .x{position:absolute;top:8px;right:12px;color:#8a8070;font-size:18px;cursor:pointer}
.card.notice .go{font-family:var(--font);font-size:13px;color:var(--blue);margin-top:6px;font-weight:600}
.tl .tabs{background:#f4efe6}
.sp{height:10px}
/* apple sheet */
.as{padding:26px 22px;text-align:center;flex:1;background:#fff}
.as .ai{width:62px;height:62px;border-radius:14px;background:#1d1a16;color:#fff;margin:6px auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-family:Georgia,serif}
.as h4{margin:0 0 6px;font-size:20px}
.as p{margin:0;font-size:14px;color:#555;line-height:1.4}
.as .opt{background:#f2f2f7;border-radius:10px;margin-top:16px;text-align:left}
.as .opt div{padding:12px 14px;font-size:15px;display:flex;justify-content:space-between}
.as .opt div+div{border-top:.5px solid var(--sep)}
.as .opt em{font-style:normal;color:var(--blue)}
.spin{width:34px;height:34px;border:3.5px solid #d6d6db;border-top-color:#777;border-radius:50%;margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ill{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.ill .dev{border:3px solid var(--blue);border-radius:12px;width:56px;height:96px;position:relative}
.ill .dev.pad{width:100px;height:76px;border-radius:10px}
.ill .dev i{position:absolute;left:8px;right:8px;top:14px;height:16px;border-radius:4px;background:#cfe3ff}
.ill .dev i+i{top:36px;opacity:.6}
.ill .mv{color:var(--blue);font-size:22px}
.ill .th{width:34px;height:22px;background:var(--blue);border-radius:5px;position:relative;top:-6px}
.hint{font-size:11px;color:#999;margin-top:6px}
</style>
</head>
<body>
<nav id="side"></nav>
<div id="main"><div id="stage"></div><div id="cap"></div><div id="nextprev"></div></div>
<script>
"use strict";
const APPLE='<svg viewBox="0 0 17 20"><path d="M14.1 10.6c0-2.4 2-3.5 2.1-3.6-1.1-1.700-2.900-1.900-3.500-1.900-1.500-.15-2.900.9-3.700.9s-1.900-.9-3.200-.8C4.200 5.200 2.700 6.200 1.800 7.600c-1.800 3.100-.5 7.700 1.300 10.200.9 1.200 1.900 2.600 3.200 2.500 1.300-.05 1.800-.8 3.300-.8s2 .8 3.300.8c1.400 0 2.200-1.200 3.100-2.400 1-1.400 1.400-2.800 1.400-2.900 0 0-2.700-1-2.700-4.100zM11.600 3.200c.7-.9 1.200-2 1-3.200-1 0-2.300.7-3 1.500-.6.700-1.200 1.900-1 3 1.100.1 2.300-.5 3-1.300z"/></svg>';
const T2="Thought Reps works fully without sync. Signing in only creates a sync account; your email is used for subscription and account notices.";

/* ---------- helpers ---------- */
const g=(id)=>`data-go="${id}"`;
const status=(dark)=>`<div class="status"><span>9:41</span><i>▂▄▆ ▮▮▮</i></div>`;
const nav=(o)=>`<div class="nav">${o.back?`<div class="l chev" ${g(o.back[1])}>${o.back[0]}</div>`:(o.left?`<div class="l" ${o.left[1]?g(o.left[1]):''}>${o.left[0]}</div>`:'<div></div>')}<div class="t">${o.title||''}</div>${o.right?`<div class="r ${o.right[2]||''}" ${o.right[1]?g(o.right[1]):''}>${o.right[0]}</div>`:'<div></div>'}</div>`;
const sec=(h,rows,f,fc)=>`<div class="sec">${h?`<h3>${h}</h3>`:''}<div class="grp">${rows}</div>${f?`<div class="f ${fc||''}">${f}</div>`:''}</div>`;
const row=(lab,o={})=>`<div class="row ${o.cls||''} ${o.go?'chv':''}" ${o.go?g(o.go):''}>${o.tile?`<div class="tile" style="background:${o.tile[1]}">${o.tile[0]}</div>`:''}<div class="lab">${lab}${o.sub?`<span class="sub">${o.sub}</span>`:''}</div>${o.val?`<span class="val ${o.vcls||''}">${o.val}</span>`:''}${o.sw!==undefined?`<div class="sw ${o.sw?'on':''}" ${o.swgo?g(o.swgo):''}></div>`:''}</div>`;
const btn=(t,cls,go)=>`<div class="btn ${cls}" ${go?g(go):''}>${t}</div>`;
const tabs=(dot)=>`<div class="tabs"><div><u>◔</u>Timeline</div><div><u>⌕</u>Search</div><div class="on"><u>⚙︎</u>Settings${dot?'<span class="dot"></span>':''}</div></div>`;
const phone=(inner)=>`<div class="phone">${status()}<div class="screen" style="height:calc(100% - 47px)">${inner}</div></div>`;
const alertBox=(title,msg,acts,vert,input)=>`<div class="dim" style="z-index:8"></div><div class="alert"><div class="a-b"><b>${title}</b>${msg}${input?`<input value="${input}">`:''}</div><div class="a-a ${vert?'v':''}">${acts.map(a=>`<div ${g(a[1])} class="${a[2]||''}">${a[0]}</div>`).join('')}</div></div>`;
const sheet=(o,body,cls)=>`<div class="dim"></div><div class="sheet ${cls||''}"><div class="grab"></div><div style="height:6px"></div>${nav(o)}<div class="body">${body}</div></div>`;
const wrap=(o)=>phone(`${o.nav||''}<div class="body">${o.body||''}</div>${o.tab||''}${o.over||''}`);

/* ---------- Settings parents ---------- */
function settings(syncRow,dot,over){
 return wrap({nav:nav({title:'Settings'}),tab:tabs(dot),over,body:
  sec('',row('Appearance',{go:'',tile:['Aa','#5856d6'],cls:'ic'})+row('Theme',{tile:['◐','#34aadc'],val:'Ink',cls:'ic'}))+
  sec('',row('Reminders',{tile:['!','#ff3b30'],val:'Off',cls:'ic'}))+
  sec('',syncRow)+
  sec('',row('Backup',{tile:['↧','#8e8e93'],cls:'ic',go:''})+row('Export Link',{tile:['↗','#30b0c7'],cls:'ic',go:''}))+
  sec('',row('Help Center',{go:''})+row('Send Feedback',{go:''})+row('About',{val:'1.0',go:''}))});
}
const syncRowOf=(val,vcls,go,sub)=>row('Sync',{tile:['⇅','#007aff'],cls:'ic',val,vcls,go});

/* ---------- Setup (S1) ---------- */
function s1(over,banner){
 return wrap({nav:nav({back:['Settings','set-off'],title:'Sync'}),over,body:`
 <div class="hero"><div class="ill"><div class="dev"><i></i><i></i></div><span class="mv">⇄</span><div class="dev pad"><i></i><i></i></div></div>
 <h2>Sync your thoughts</h2>
 <p>Keep your thoughts, tags and images the same on your iPhone and iPad. They're encrypted on your devices before they're uploaded, so nobody else can read them, including us.</p></div>
 <div class="facts"><div class="fact">Up to 3 devices</div><div class="fact">1 GB of storage</div><div class="fact">1 month free, then $2.99/month</div></div>
 ${banner||''}
 <div class="apple" ${g('S2')}>${APPLE} Continue with Apple</div>
 ${btn('Join with a QR code or recovery code','s','S6a')}
 <div class="small">${T2}<br><a>Terms of Use</a> · <a>Privacy Policy</a></div>`});
}
function s2(variant){
 const sh=`<div class="dim"></div><div class="sheet short white"><div class="grab"></div><div class="as" style="padding-top:34px">
 <div class="ai">T</div><h4>Sign in to Thought Reps with your Apple Account</h4><p>nick@icloud.com</p>
 <div class="opt"><div>Email<em>Share My Email</em></div><div>Name<span style="color:#999">Not requested</span></div></div>
 <div style="margin-top:22px;font-size:34px;color:var(--blue)">◉</div><p style="font-size:13px">Double-click the side button to continue</p>
 <div class="btn p" style="margin-top:16px" ${g(variant==='fail'?'S2b':'S3a')}>Continue with Passcode</div>
 <div class="btn s" ${g('S1')}>Cancel</div>${variant==='hint'?'':''}</div></div>`;
 return s1(sh);
}
const s2b=()=>s1('', `<div class="banner"><b>⚠︎</b> Couldn't reach the server. Check your connection.<span class="try" ${g('S2')}>Try Again</span></div>`);
const s2c=()=>s1('', `<div class="banner"><b>⚠︎</b> Sync isn't available on this device.</div>`);

/* ---------- Subscribe ---------- */
function s3full(eligible,conflict){
 const inner=`<div class="hero" style="padding-top:8px"><h2 style="margin-top:0">${eligible?'Start your free month':'Subscribe to sync'}</h2></div>
 <div class="facts" style="margin-top:6px"><div class="fact">Up to 3 devices</div><div class="fact">1 GB of storage</div><div class="fact">1 month free, then $2.99/month</div></div>
 <p class="small" style="text-align:left;font-size:14px;color:#555;margin-top:10px">After the free month, $2.99/month. Cancel anytime in Settings › Apple Account › Subscriptions.</p>
 ${conflict?`<div class="banner"><b>⚠︎</b><span>This subscription is already used by another sync account. <a style="color:var(--blue);font-weight:600">Contact Support</a></span></div>`:''}
 ${btn(eligible?'Try It Free':'Subscribe','p',conflict?'':'S3pay'+(eligible?'':'n'))}
 ${btn('Restore Purchases','s',conflict?'':'S4a')}
 <div class="small"><a>Terms of Use</a> · <a>Privacy Policy</a></div>`;
 return s1(sheet({left:['Cancel','S1']},inner));
}
function s3pay(eligible){
 const over=`<div class="dim" style="z-index:7"></div><div class="sheet short white" style="z-index:8"><div class="grab"></div><div class="as" style="padding-top:30px">
 <div class="ai">T</div><h4>Thought Reps Sync</h4><p>${eligible?'1 month free, then $2.99/month. Renews automatically.':'$2.99/month. Renews automatically.'}</p>
 <div class="opt"><div>Account<em>nick@icloud.com</em></div><div>${eligible?'Due today':'Price'}<em>${eligible?'$0.00':'$2.99'}</em></div></div>
 <div style="margin:18px 0 0;font-size:34px;color:var(--blue)">◉</div><p style="font-size:13px">Double-click to ${eligible?'Subscribe':'Pay'}</p>
 <div class="btn p" style="margin-top:14px" ${g('S4a')}>Confirm</div><div class="btn s" ${g(eligible?'S3a':'S3b')}>Cancel</div></div></div>`;
 return s1(over);
}

/* ---------- S4 ---------- */

const ID={};SCREENS.forEach((s,i)=>ID[s[1]]=i);

function render(id){
 if(!(id in ID))return;
 const s=SCREENS[ID[id]];
 document.getElementById('stage').innerHTML=s[4]();
 document.getElementById('cap').innerHTML='<b>'+s[1]+'</b> · '+s[2]+'<br>'+s[3];
 const i=ID[id];
 document.getElementById('nextprev').textContent=(i+1)+' / '+SCREENS.length;
 document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
 const on=document.querySelector('#side a.on');if(on)on.scrollIntoView({block:'nearest'});
 if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
}
function buildSide(){
 let h='<h1>Sync Setup Mockups</h1><p class="note">Click a screen, or tap buttons on the phone to follow the flow. Mock data only.</p>',grp='';
 SCREENS.forEach(s=>{if(s[0]!==grp){grp=s[0];h+=`<h2>${grp}</h2>`}h+=`<a data-id="${s[1]}"><b>${s[1].replace(/^S7c(\d)/,'S7·$1')}</b>${s[2]}</a>`});
 document.getElementById('side').innerHTML=h;
}
buildSide();
document.addEventListener('click',e=>{
 const a=e.target.closest('#side a');if(a){render(a.dataset.id);return}
 const t=e.target.closest('[data-go]');if(!t)return;
 const id=t.getAttribute('data-go');
 if(id in ID)render(id);
});
render(location.hash.slice(1) in ID?location.hash.slice(1):'set-off');
