<title>Thought Reps Icon Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: notebook-paper page; a grid of icon study cards (big icon + real iOS sizes), and a sticky home-screen preview of the selected one. */
:root {
  --paper: #F6F7FB; --dots: #D5DAE7; --card: #FFFFFF; --line: #E3E5EA;
  --ink: #15171C; --muted: #5B6170; --accent: #3451D1; --accent-soft: #E8ECFB;
  --wall-a: #DCE5FF; --wall-b: #FFF2A8; --ph: rgba(21,23,28,.10); --label: #15171C;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --hand: "Caveat", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111319; --dots: #262B38; --card: #1A1D25; --line: #2B2F3B;
  --ink: #E9EBF2; --muted: #9AA0B0; --accent: #8EA2FF; --accent-soft: #1F2747;
  --wall-a: #1E2546; --wall-b: #3A3420; --ph: rgba(255,255,255,.10); --label: #E9EBF2; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #111319; --dots: #262B38; --card: #1A1D25; --line: #2B2F3B;
  --ink: #E9EBF2; --muted: #9AA0B0; --accent: #8EA2FF; --accent-soft: #1F2747;
  --wall-a: #1E2546; --wall-b: #3A3420; --ph: rgba(255,255,255,.10); --label: #E9EBF2; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background-color: var(--paper); background-image: radial-gradient(var(--dots) 1.2px, transparent 1.3px); background-size: 22px 22px; color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 72px; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; }
header .hand { font: 600 24px/1 var(--hand); color: var(--accent); transform: rotate(-2deg); transform-origin: left; display: inline-block; margin-bottom: 6px; }
h1 { margin: 0; font: 800 clamp(30px, 5vw, 48px)/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
header p { margin: 8px 0 0; color: var(--muted); max-width: 56ch; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; font: 500 14px var(--body); color: var(--muted); padding: 8px 14px; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s; }
.seg button:hover { color: var(--ink); background: var(--accent-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.rounds { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
.round { display: flex; flex-direction: column; gap: 16px; }
.round-head h2 { margin: 0; font: 700 22px/1.2 var(--display); letter-spacing: -.01em; }
.round-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card { position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: border-color .15s, transform .15s, box-shadow .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card:active { transform: translateY(0); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.card .tag { position: absolute; top: 14px; right: 14px; font: 600 20px/1 var(--hand); color: var(--accent); transform: rotate(4deg); opacity: 0; transition: opacity .15s; }
.card[aria-pressed="true"] .tag { opacity: 1; }
.big { display: flex; justify-content: center; padding-block: 6px; }
.sizes { display: flex; align-items: flex-end; gap: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sizes figcaption { font: 500 10px/1 var(--mono); color: var(--muted); }
.card h2 { margin: 0; font: 700 19px/1.2 var(--display); letter-spacing: -.01em; }
.card p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.num { font: 500 12px/1 var(--mono); color: var(--accent); }

.icon { display: block; overflow: hidden; border-radius: 22.37%; flex: none; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 16px rgba(21,23,28,.10); }
.icon svg { display: block; width: 100%; height: 100%; }

aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 960px) { aside { position: static; } }
aside .k { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.home { border-radius: 36px; padding: 26px 20px 18px; background: linear-gradient(160deg, var(--wall-a), var(--wall-b)); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; }
.home.dark { --wall-a: #10131F; --wall-b: #23202A; --ph: rgba(255,255,255,.12); --label: #F1F2F6; }
.home.light { --wall-a: #DCE5FF; --wall-b: #FFF2A8; --ph: rgba(21,23,28,.10); --label: #15171C; }
.apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 10px; justify-items: center; }
.app { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
.app .ph { width: 56px; height: 56px; border-radius: 22.37%; background: var(--ph); }
.app span { font: 500 10.5px/1.2 var(--body); color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.app.ph-l span { visibility: hidden; }
.dock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); justify-items: center; padding: 12px 8px; border-radius: 26px; background: var(--ph); }
.dock .ph { width: 52px; height: 52px; border-radius: 22.37%; background: var(--ph); }
.chosen { font-size: 14px; color: var(--muted); }
.chosen b { color: var(--ink); }
@media (max-width: 380px) { .app .ph, #homeIcon .icon { width: 48px !important; height: 48px !important; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <span class="hand">round thirteen: color</span>
      <h1>Thought Reps icon studies</h1>
      <p>The larger Big loop icon in ten color palettes. Earlier rounds are below. Each icon is shown big, then at real iOS sizes. Tap a card to see it on a home screen.</p>
    </div>
    <div class="seg" role="group" aria-label="Icon appearance">
      <button type="button" data-mode="light" aria-pressed="true">Light</button>
      <button type="button" data-mode="dark" aria-pressed="false">Dark</button>
      <button type="button" data-mode="tinted" aria-pressed="false">Tinted</button>
    </div>
  </header>

  <div class="layout">
    <div class="rounds" id="grid"></div>
    <aside aria-label="Home screen preview">
      <span class="k">On a home screen</span>
      <div class="home light" id="home">
        <div class="apps" id="apps"></div>
        <div class="dock" aria-hidden="true"><span class="ph"></span><span class="ph"></span><span class="ph"></span><span class="ph"></span></div>
      </div>
      <p class="chosen" id="chosen"></p>
    </aside>
  </div>
</div>
